[package]
name = "liteinst-rewrite"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-2-Clause"
description = "Standalone core-driven ELF candidate emission"
publish = false

[lib]
name = "liteinst_rewrite"
path = "src/lib.rs"

[[bin]]
name = "liteinst-rewrite"
path = "src/main.rs"

[dependencies]
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
li2core = { package = "liteinst2", path = "../.." }
formats = { package = "liteinst-artifact", path = "../../crates/liteinst-artifact" }

[dev-dependencies]
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "code_asm", "instr_info"] }

[[example]]
name = "common_sites"
path = "examples/common_sites.rs"
test = true

[[example]]
name = "verify_common_core"
path = "examples/verify_common_core.rs"
test = true

[[example]]
name = "disassembly_sites"
path = "examples/disassembly_sites.rs"
