name: NFF stress

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  NFF_MAIN: 6612c39fd3aeb97cd209e469bced5d935aa3b01a
  NFF_PR118: 5dd98176f2fea1a132feaf0f53a79c171370035c
  NFF_R: "10"

jobs:
  stress:
    name: NFF stress (${{ matrix.profile }}, ${{ matrix.replica }})
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
        replica: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
        timeout-minutes: 10
      - name: Classifier controls
        timeout-minutes: 10
        run: bash .github/nff/controls.sh
      - name: Check out both heads by sha
        timeout-minutes: 10
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$NFF_MAIN" "$NFF_PR118"
          git worktree add --detach "$RUNNER_TEMP/main" "$NFF_MAIN"
          git worktree add --detach "$RUNNER_TEMP/pr118" "$NFF_PR118"
          echo "NFF-HEAD main=$(git -C "$RUNNER_TEMP/main" rev-parse HEAD) pr118=$(git -C "$RUNNER_TEMP/pr118" rev-parse HEAD)"
      - name: Build both heads
        timeout-minutes: 60
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          flag=""
          if [ "$PROFILE" = release ]; then flag="--release"; fi
          for head in main pr118; do
            (cd "$RUNNER_TEMP/$head" && cargo test --locked $flag -p liteinst-launch --all-features --lib --test selected_gate --test b3_exec_admission --no-run)
          done
      - name: Stress rows 12 and 13 by exact name, heads interleaved
        timeout-minutes: 200
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set +e -uo pipefail
          flag=""
          if [ "$PROFILE" = release ]; then flag="--release"; fi
          classify="$GITHUB_WORKSPACE/.github/nff/classify.sh"
          b3='blocked_exec_resolver_uses_original_deadline_and_owner_cleanup|exec_full_comparator_rejects_each_state_input_map_and_identity_corruption|original_exec_replacement_matches_raw_replay_and_native_full_state|resolver_panic_after_actual_exec_keeps_original_failure_and_cleanup|stale_exec_source_reply_preserves_actual_replacement_without_commit'
          calib() {
            out="$RUNNER_TEMP/cal-$1.txt"
            (cd "$RUNNER_TEMP/main" && timeout -k 10 600 cargo test --locked $flag -p liteinst-launch --all-features --test b3_exec_admission) > "$out" 2>&1
            rc=$?
            cat "$out"
            refusals=$(grep -c -F 'native selected full register completion differs' "$out")
            oks=$(grep -c -x -E "test ($b3) \.\.\. ok" "$out")
            if [ "$refusals" -ge 1 ]; then class=UNCALIBRATED
            elif [ "$oks" -eq 5 ] && [ "$rc" -eq 0 ]; then class=CALIBRATED
            else class=UNCLEAR; fi
            echo "NFF-CAL bracket=$1 rc=$rc refusals=$refusals ok=$oks/5 class=$class"
            if [ "$rc" -ne 0 ]; then tail -n 40 "$out" | cut -c1-400 | sed "s/^/NFF-CAL-TAIL bracket=$1: /"; fi
          }
          run_one() {
            head=$1; row=$2; rep=$3
            if [ "$row" = 13 ]; then
              target="--test selected_gate"
              name=selected_interpreter_and_executable_instruction_one_complete_exactly_once
            else
              target="--lib"
              name=linux::remote::dynamic::owner::admission::runtime::ordinary::native_tests::runtime_ordinary_single_step_stops_before_same_page_marker
            fi
            out="$RUNNER_TEMP/x-$head-$row-$rep.txt"
            echo "NFF-EXEC head=$head row=$row rep=$rep"
            (cd "$RUNNER_TEMP/$head" && timeout -k 10 240 cargo test --locked $flag -p liteinst-launch --all-features $target -- --exact "$name") > "$out" 2>&1
            rc=$?
            cat "$out"
            bash "$classify" "$out" "$rc" "$head" "$row" "$rep"
          }
          calib pre
          pre=$class
          echo "NFF-JOB-PRE profile=$PROFILE class=$pre"
          for rep in $(seq 1 "$NFF_R"); do
            for row in 13 12; do
              if [ $((rep % 2)) -eq 1 ]; then order="main pr118"; else order="pr118 main"; fi
              for head in $order; do run_one "$head" "$row" "$rep"; done
            done
          done
          calib post
          post=$class
          if [ "$pre" = CALIBRATED ] && [ "$post" = CALIBRATED ]; then job=CALIBRATED
          elif [ "$pre" != CALIBRATED ] && [ "$post" != CALIBRATED ] && { [ "$pre" = UNCALIBRATED ] || [ "$post" = UNCALIBRATED ]; }; then job=UNCALIBRATED-BY-SIGNATURE
          else job=UNCLEAR; fi
          echo "NFF-JOB profile=$PROFILE class=$job pre=$pre post=$post"
          exit 0
