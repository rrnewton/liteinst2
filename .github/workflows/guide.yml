name: Guide

# Builds the mdBook guide in guide/ and, on main, deploys it to GitHub
# Pages. The doc job also guards the docs.rs surface: rustdoc must stay
# warning-free for every published crate (enforced via RUSTDOCFLAGS;
# only the root crate denies warnings in-source).
#
# Deployment is a NO-OP until GitHub Pages is enabled for this repo
# (Settings -> Pages -> Source: "GitHub Actions", a repo-admin/owner
# decision) AND the repo variable PAGES_ENABLED is set to "true". The
# build job always runs; upload/deploy are skipped while unenabled, so
# this workflow can merge before Pages exists. On push to main with the
# variable unset, the build job runs green and upload/deploy are SKIPPED:
# nothing is published and no repo setting is touched (deploy-pages never
# executes, and it cannot enable Pages itself).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build guide and API docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MDBOOK_VERSION: "0.4.52"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch mdBook
        env:
          MDBOOK_SHA256: "c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768"
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSL --max-time 120 -o "$RUNNER_TEMP/mdbook.tar.gz" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - name: Build guide
        run: mdbook build guide
      - name: Test guide snippets
        run: mdbook test guide
      - name: Check under-construction count matches the front page
        run: |
          counted=$(grep -r --count '<!-- UC:' guide/src | awk -F: '{s+=$2} END {print s}')
          stated=$(grep -o 'Under-construction regions in this guide: [0-9]*' guide/src/introduction.md | grep -o '[0-9]*$')
          echo "counted=$counted stated=$stated"
          [ "$counted" = "$stated" ]
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain via input below
        with:
          toolchain: stable
      - name: API docs (published cohort, warnings denied)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo doc --locked --no-deps
          -p liteinst -p liteinst-x86 -p liteinst-aarch64 -p liteinst-aarch64-patch -p liteinst-artifact
          -p liteinst-admission -p liteinst-inprocess -p liteinst-launch
      - name: API docs (offline-router surface, as docs.rs builds it)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps -p liteinst --features offline-router
      - name: Package allowlist guard (docs.rs metadata must not swallow include)
        run: |
          count=$(cargo package --locked --list | wc -l)
          echo "packaged files: $count"
          # Curated allowlist is 400 files; a swallowed `include` ships ~7700.
          # Headroom only for small deliberate allowlist growth.
          [ "$count" -lt 500 ]
      - name: Doctests
        run: >
          cargo test --locked --doc
          -p liteinst -p liteinst-x86 -p liteinst-aarch64 -p liteinst-aarch64-patch -p liteinst-artifact
          -p liteinst-admission -p liteinst-inprocess -p liteinst-launch
      - name: Upload Pages artifact
        if: vars.PAGES_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: guide/book

  deploy:
    name: Deploy to GitHub Pages
    # Never cancel a deploy mid-flight (the workflow-level group cancels builds).
    concurrency:
      group: guide-deploy-${{ github.ref }}
      cancel-in-progress: false
    needs: build
    if: vars.PAGES_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
