name: Guide

# Builds the mdBook guide in guide/ and, on main, deploys it to GitHub
# Pages. The doc job also guards the docs.rs surface: rustdoc must stay
# warning-free for every published crate (enforced via RUSTDOCFLAGS;
# only the root crate denies warnings in-source).
#
# Deployment is a NO-OP until GitHub Pages is enabled for this repo
# (Settings -> Pages -> Source: "GitHub Actions", a repo-admin/owner
# decision) AND the repo variable ENABLE_PAGES is set to "true". The
# build job always runs; upload/deploy are skipped while unenabled, so
# this workflow can merge before Pages exists.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build guide and API docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MDBOOK_VERSION: "0.4.52"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch mdBook
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSL --max-time 120 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - name: Build guide
        run: mdbook build guide
      - name: Check under-construction count matches the front page
        run: |
          counted=$(grep -r --count '<!-- UC:' guide/src | awk -F: '{s+=$2} END {print s}')
          stated=$(grep -o 'Under-construction regions in this guide: [0-9]*' guide/src/introduction.md | grep -o '[0-9]*$')
          echo "counted=$counted stated=$stated"
          [ "$counted" = "$stated" ]
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustdoc
      - name: API docs (published cohort, warnings denied)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo doc --locked --no-deps
          -p liteinst -p liteinst-x86 -p liteinst-artifact
          -p liteinst-admission -p liteinst-inprocess -p liteinst-launch
      - name: API docs (offline-router surface, as docs.rs builds it)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps -p liteinst --features offline-router
      - name: Package allowlist guard (docs.rs metadata must not swallow include)
        run: |
          count=$(cargo package --locked --list | wc -l)
          echo "packaged files: $count"
          # Curated allowlist is ~400 files; a swallowed `include` ships ~7700.
          [ "$count" -lt 1000 ]
      - name: Doctests
        run: >
          cargo test --locked --doc
          -p liteinst -p liteinst-x86 -p liteinst-artifact
          -p liteinst-admission -p liteinst-inprocess -p liteinst-launch
      - name: Upload Pages artifact
        if: vars.ENABLE_PAGES == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: guide/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: vars.ENABLE_PAGES == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
