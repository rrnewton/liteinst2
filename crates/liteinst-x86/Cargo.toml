[package]
name = "liteinst-x86"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-2-Clause"
description = "Shared descriptive x86 decode and selected-operand facts"

[dependencies]
iced-x86 = { version = "=1.21.0", default-features = false, features = ["decoder"] }

[features]
default = ["std"]
std = ["iced-x86/std"]

# A freestanding consumer disables defaults and selects iced-x86/no_std in
# its independent dependency graph. Do not expose an opposing no_std feature:
# workspace --all-features must not select both iced memory modes.
