[package]
name = "liteinst-aarch64"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "BSD-2-Clause"
repository = "https://github.com/rrnewton/liteinst2"
description = "Shared descriptive AArch64 decode and selected-operand facts"
readme = "README.md"

# Portable no_std decoder with no runtime dependencies; docs are built for
# the primary target only, to match the rest of the published cohort.
[package.metadata.docs.rs]
targets = ["aarch64-unknown-linux-gnu"]

# The differential oracle is a test-only reference. It is never a runtime
# dependency: production decode facts come only from this crate.
[dev-dependencies]
yaxpeax-arch = "0.3"
yaxpeax-arm = "0.5"

# Execution tests (tests/emit_exec.rs) run only on AArch64 targets and
# need raw mmap/memfd/sigaction access. Test code only, like the oracle.
[target.'cfg(target_arch = "aarch64")'.dev-dependencies]
libc = "0.2"
