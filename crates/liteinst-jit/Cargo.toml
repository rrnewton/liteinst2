[package]
name = "liteinst-jit"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "BSD-2-Clause"
repository = "https://github.com/rrnewton/liteinst2"
readme = "README.md"
description = "Bounded direct-block translation with folded branch counting (P1a)"
# Branch-only P1a work: not published until the repository-cutover
# decision on translator crates is answered.
publish = false

# This crate is compile_error! off Linux x86-64; docs.rs must not try
# its default multi-target set.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "encoder", "code_asm", "instr_info"] }
libc = "0.2.186"

[[bin]]
name = "liteinst-jit-run"
path = "src/bin/run.rs"
test = false
bench = false
doc = false

[[bin]]
name = "liteinst-jit-o1-child"
path = "src/bin/o1_child.rs"
test = false
bench = false
doc = false

[[bin]]
name = "liteinst-jit-custody-child"
path = "src/bin/custody_child.rs"
test = false
bench = false
doc = false

[[bin]]
name = "liteinst-jit-remote-child"
path = "src/bin/remote_child.rs"
test = false
bench = false
doc = false
