[package]
name = "liteinst-inprocess"
version = "0.2.1"
edition = "2024"
rust-version = "1.94"
license = "BSD-2-Clause"
repository = "https://github.com/rrnewton/liteinst2"
readme = "README.md"
description = "Caller-owned in-process NX first-touch gate"

# This crate is compile_error! off Linux x86-64; docs.rs must not try
# its default multi-target set.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
liteinst = { version = "0.2.0", path = "../.." }
libc = "0.2.186"
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder"] }

# Release-only native probes execute x86-64 code; opt-in so default builds
# on other targets skip them by name instead of failing.
[features]
native-probes = []

[[example]]
name = "native_probe"
path = "examples/native_probe.rs"
required-features = ["native-probes"]
test = false
bench = false
doc = false

[[example]]
name = "selected_probe"
path = "examples/selected_probe.rs"
required-features = ["native-probes"]
test = false
bench = false
doc = false
