[package]
name = "liteinst2"
version = "0.1.0"
edition = "2024"
description = "Online x86-64 instrumentation using instruction punning"
repository = "https://github.com/rrnewton/liteinst2"
readme = "README.md"
license = "BSD-2-Clause"
keywords = ["instrumentation", "x86-64", "patching", "trampoline"]
categories = ["development-tools", "os::linux-apis"]
rust-version = "1.85"
# Root anchors keep explicit documentation names out of private work directories.
include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/INTERFACES.md",
    "/A1-QUIESCENT.md",
    "/A2-COMPOSITION.md",
    "/COALESCED-CONTROLS.md",
    "/SEARCH-EVIDENCE.md",
    "/PATCH_SITE_DECISION_TREE.md",
    "/README.md",
    "/examples/preload_consumer.rs",
    "/examples/replace_first.rs",
    "/examples/saved_pkru_probe.rs",
    "/src/**",
    "/tests/**",
]

[[example]]
name = "preload_consumer"
path = "examples/preload_consumer.rs"
crate-type = ["cdylib"]
test = false

# Make the tools/ crates part of the workspace so, e.g.,
# `cargo run --release -p rapid-profiler` works from the repository root.
[workspace]
members = ["tools/rapid-profiler", "tools/exception-oracle"]

[dependencies]
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "code_asm", "instr_info"] }
libc = "0.2.186"
memmap2 = "0.9.11"
nix = { version = "0.31.3", features = ["mman", "process", "signal"] }

[[bin]]
name = "liteinst2-arena-fork-fixture"
path = "tests/support/arena_fork_fixture.rs"

# Explicit host-only physical evidence; no runtime activation or default code.
[features]
saved-pkru-probe = []

[[example]]
name = "saved_pkru_probe"
path = "examples/saved_pkru_probe.rs"
required-features = ["saved-pkru-probe"]
test = false
bench = false

# Native state fixtures execute on a fresh process main thread.
[[bin]]
name = "successor-eviction-oracle-driver"
path = "tests/support/successor_eviction_driver.rs"
test = false
bench = false
doc = false

[[bin]]
name = "eviction-chain-oracle-driver"
path = "tests/support/eviction_chain_driver.rs"
test = false
bench = false
doc = false

[[bin]]
name = "eviction-chain-extension-driver"
path = "tests/support/eviction_chain_extension_driver.rs"
test = false
bench = false
doc = false

[[bin]]
name = "boundary-signal-oracle-driver"
path = "tests/support/boundary_signal_driver.rs"
test = false
bench = false
doc = false
